<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardano Browser Wallet</title>
    <script src="../../bundle.js"></script>
    <script src="../../scripts/cardano/browser_cardano.mjs" type="module"></script>
    <link rel="icon" type="image/x-icon" href="../../statics/favicon.ico"/>

<body>
    <button onclick="onChainDapp.cardano.connect()">Connect</button><br><br>
    <button onclick="onChainDapp.cardano.getExtensions()">Get Extensions</button><br><br>
    <button onclick="onChainDapp.cardano.isEnabled()">Is Enabled</button><br><br>
    <button onclick="onChainDapp.cardano.getUsedAddresses()">Get Used Addresses</button><br><br>
    <button onclick="onChainDapp.cardano.getUnusedAddresses()">Get Unused Addresses</button><br><br>
    <button onclick="onChainDapp.cardano.getChangeAddress()">Get Change Address</button><br><br>
